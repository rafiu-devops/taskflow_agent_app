<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="tfRobotTitle">
  <title id="tfRobotTitle">TaskFlow AI robot mascot waving beside floating workforce cards</title>

  <defs>
    <radialGradient id="tfGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#4F8CFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tfShell" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F7FAFF" />
      <stop offset="100%" stop-color="#DCE7FA" />
    </linearGradient>

    <linearGradient id="tfShellSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4EDFC" />
    </linearGradient>

    <linearGradient id="tfBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1765FF" />
    </linearGradient>

    <linearGradient id="tfFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12224A" />
      <stop offset="100%" stop-color="#071A4A" />
    </linearGradient>

    <linearGradient id="tfCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#EAF1FF" stop-opacity="0.94" />
    </linearGradient>

    <filter id="tfDrop" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B1742" flood-opacity="0.16" />
    </filter>

    <filter id="tfCardShadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1742" flood-opacity="0.12" />
    </filter>

    <filter id="tfBlurSoft" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <filter id="tfBlurEye" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="400" cy="405" rx="348" ry="348" fill="url(#tfGlow)" />

  <!-- contact shadow -->
  <ellipse cx="400" cy="712" rx="168" ry="24" fill="#1765FF" opacity="0.16" filter="url(#tfBlurSoft)" />

  <!-- ============ floating workforce cards ============ -->

  <!-- employees -->
  <g filter="url(#tfCardShadow)">
    <rect x="64" y="88" width="196" height="130" rx="26" fill="url(#tfCard)" stroke="#C7DBFB" stroke-width="3" />
  </g>
  <circle cx="112" cy="131" r="17" fill="#1765FF" />
  <path d="M86 180 Q112 116 138 180 Z" fill="#1765FF" />
  <circle cx="148" cy="142" r="13" fill="#7FB0FF" />
  <path d="M128 182 Q148 130 168 182 Z" fill="#7FB0FF" />
  <rect x="184" y="122" width="56" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="184" y="146" width="42" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="184" y="170" width="50" height="11" rx="5.5" fill="#C9D9F6" />

  <!-- tasks & calendar -->
  <g filter="url(#tfCardShadow)">
    <rect x="540" y="68" width="196" height="130" rx="26" fill="url(#tfCard)" stroke="#C7DBFB" stroke-width="3" />
  </g>
  <rect x="564" y="102" width="70" height="66" rx="14" fill="#FFFFFF" stroke="#1765FF" stroke-width="4" />
  <path d="M564 118a14 14 0 0 1 14-14h42a14 14 0 0 1 14 14v6h-70z" fill="#1765FF" />
  <rect x="578" y="92" width="7" height="18" rx="3.5" fill="#1765FF" />
  <rect x="613" y="92" width="7" height="18" rx="3.5" fill="#1765FF" />
  <circle cx="638" cy="164" r="18" fill="#16B86A" />
  <path d="M630 164l6 6 12-13" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="664" y="106" width="56" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="664" y="130" width="42" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="664" y="154" width="50" height="11" rx="5.5" fill="#C9D9F6" />

  <!-- performance analytics -->
  <g filter="url(#tfCardShadow)">
    <rect x="40" y="452" width="190" height="126" rx="26" fill="url(#tfCard)" stroke="#C7DBFB" stroke-width="3" />
  </g>
  <rect x="64" y="548" width="80" height="7" rx="3.5" fill="#B9CEF3" />
  <rect x="64" y="520" width="20" height="28" rx="7" fill="#9CC0FF" />
  <rect x="92" y="504" width="20" height="44" rx="7" fill="#4F8CFF" />
  <rect x="120" y="488" width="20" height="60" rx="7" fill="#1765FF" />
  <path d="M66 496 96 478 130 462" fill="none" stroke="#16B86A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M117 461h15v15" fill="none" stroke="#16B86A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="160" y="486" width="56" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="160" y="508" width="44" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="160" y="530" width="52" height="11" rx="5.5" fill="#C9D9F6" />

  <!-- departments & folders -->
  <g filter="url(#tfCardShadow)">
    <rect x="566" y="470" width="194" height="128" rx="26" fill="url(#tfCard)" stroke="#C7DBFB" stroke-width="3" />
  </g>
  <path d="M586 508a12 12 0 0 1 12-12h22l10 12h36a12 12 0 0 1 12 12v34a12 12 0 0 1-12 12H598a12 12 0 0 1-12-12z" fill="#1765FF" />
  <rect x="586" y="526" width="94" height="44" rx="12" fill="#5B93FF" />
  <rect x="696" y="504" width="52" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="696" y="526" width="40" height="11" rx="5.5" fill="#C9D9F6" />
  <rect x="696" y="548" width="48" height="11" rx="5.5" fill="#C9D9F6" />

  <!-- ============ robot ============ -->
  <g filter="url(#tfDrop)">
    <!-- headphone band sits behind the head -->
    <path d="M240 272 C240 112 560 112 560 272" fill="none" stroke="url(#tfBlue)" stroke-width="30" stroke-linecap="round" />

    <!-- feet tuck under the body -->
    <rect x="306" y="646" width="90" height="54" rx="27" fill="url(#tfShellSoft)" stroke="#C9DBF9" stroke-width="3" />
    <rect x="404" y="646" width="90" height="54" rx="27" fill="url(#tfShellSoft)" stroke="#C9DBF9" stroke-width="3" />

    <!-- neck -->
    <rect x="366" y="402" width="68" height="56" rx="26" fill="#DCE7FA" />

    <!-- left arm resting -->
    <path d="M292 500 C246 534 238 578 250 616" fill="none" stroke="#C9DBF9" stroke-width="62" stroke-linecap="round" />
    <path d="M292 500 C246 534 238 578 250 616" fill="none" stroke="url(#tfShellSoft)" stroke-width="56" stroke-linecap="round" />
    <circle cx="248" cy="632" r="40" fill="url(#tfShellSoft)" stroke="#C9DBF9" stroke-width="3" />

    <!-- right arm waving -->
    <path d="M508 492 C566 470 606 418 622 356" fill="none" stroke="#C9DBF9" stroke-width="62" stroke-linecap="round" />
    <path d="M508 492 C566 470 606 418 622 356" fill="none" stroke="url(#tfShellSoft)" stroke-width="56" stroke-linecap="round" />
    <circle cx="628" cy="330" r="42" fill="url(#tfShellSoft)" stroke="#C9DBF9" stroke-width="3" />

    <!-- body -->
    <rect x="278" y="440" width="244" height="214" rx="94" fill="url(#tfShell)" stroke="#C9DBF9" stroke-width="3" />

    <!-- chest badge -->
    <circle cx="400" cy="534" r="48" fill="url(#tfBlue)" />
    <path d="M378 534 394 551 424 516" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- head -->
    <rect x="252" y="168" width="296" height="250" rx="115" fill="url(#tfShell)" stroke="#C9DBF9" stroke-width="3" />

    <!-- face display -->
    <rect x="292" y="206" width="216" height="176" rx="70" fill="url(#tfFace)" />
    <path d="M316 236 Q368 218 434 226" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="14" stroke-linecap="round" />

    <!-- glowing eyes -->
    <ellipse cx="352" cy="282" rx="18" ry="26" fill="#3AA0FF" opacity="0.85" filter="url(#tfBlurEye)" />
    <ellipse cx="448" cy="282" rx="18" ry="26" fill="#3AA0FF" opacity="0.85" filter="url(#tfBlurEye)" />
    <ellipse cx="352" cy="282" rx="18" ry="26" fill="#6FD3FF" />
    <ellipse cx="448" cy="282" rx="18" ry="26" fill="#6FD3FF" />

    <!-- friendly smile -->
    <path d="M358 322 Q400 362 442 322" fill="none" stroke="#4FC3FF" stroke-width="15" stroke-linecap="round" />

    <!-- headphone ear cups -->
    <rect x="222" y="254" width="60" height="116" rx="30" fill="url(#tfBlue)" />
    <rect x="518" y="254" width="60" height="116" rx="30" fill="url(#tfBlue)" />
    <rect x="234" y="272" width="36" height="80" rx="18" fill="#8FBCFF" opacity="0.55" />
    <rect x="530" y="272" width="36" height="80" rx="18" fill="#8FBCFF" opacity="0.55" />
  </g>
</svg>
