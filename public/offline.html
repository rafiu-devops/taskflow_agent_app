<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EAF4FA" />
    <title>TaskFlow AI — You're offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 20%, rgba(68, 217, 232, 0.45), transparent 38%),
          radial-gradient(circle at 80% 0%, rgba(8, 123, 255, 0.18), transparent 42%),
          #EAF4FA;
        color: #071426;
      }
      main {
        width: min(34rem, 100%);
        padding: 2rem;
        border-radius: 2rem;
        background: #fff;
        box-shadow: 0 24px 60px rgba(7, 20, 38, 0.12);
        text-align: center;
      }
      .badge {
        width: 4rem; height: 4rem; margin: 0 auto 1.25rem;
        display: grid; place-items: center; border-radius: 1.25rem;
        background: #071426; color: #44D9E8; font-weight: 800; font-size: 1.25rem;
      }
      h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.03em; }
      p { margin: 0.75rem 0 0; color: #78869A; line-height: 1.6; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        margin-top: 1.5rem; padding: 0.8rem 1.2rem; border-radius: 999px;
        background: #087BFF; color: #fff; text-decoration: none; font-weight: 700;
      }
      small { display: block; margin-top: 1rem; color: #78869A; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">TF</div>
      <h1>You're offline</h1>
      <p>TaskFlow AI needs a connection to reach your workspace. Live tasks, permissions and agent actions are unavailable until you're back online.</p>
      <a href="/home">Try again</a>
      <small>Your private data is never served from an untrusted offline cache.</small>
    </main>
  </body>
</html>
